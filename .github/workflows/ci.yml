name: CI

on:
  push:
  pull_request:

jobs:
  capture:
    name: capture (cargo test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capture
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libpcap headers
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: Run tests
        run: cargo test

  player:
    name: player (test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: player
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: player/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Type-check and build
        run: npm run build

  player-e2e:
    name: player (playwright e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: player
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: player/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E tests
        run: npm run e2e