[package]
name = "wiresong"
version = "0.1.0"
edition = "2021"
description = "Real-time network packet sonification backend"

[dependencies]
pcap = "2"
pnet_packet = "0.35"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
